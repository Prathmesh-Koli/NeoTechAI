<text x="790" y="1185" font-family="Arial" font-size="13" fill="#888" text-anchor="end">Page 3</text>
<text x="22" y="112" font-family="Georgia, serif" font-size="21" font-weight="bold" fill="#1a2b8c">Q.3</text>
<text x="111.7" y="111.1" transform="rotate(0.36 110 112)" font-family="'Segoe Script','Bradley Hand','Ink Free','Comic Sans MS',cursive" font-size="20" fill="#1a2b8c">1) Bayes' Rule: P(H|E) = P(E|H) x P(H) / P(E). It</text>
<text x="113.8" y="153.5" transform="rotate(-0.14 110 152)" font-family="'Segoe Script','Bradley Hand','Ink Free','Comic Sans MS',cursive" font-size="20" fill="#1a2b8c">updates the prior belief P(H) after seeing evidence E.</text>
<text x="110.9" y="190.7" transform="rotate(-0.35 110 192)" font-family="'Segoe Script','Bradley Hand','Ink Free','Comic Sans MS',cursive" font-size="20" fill="#1a2b8c">Example: 1% of people have a disease, test is 90%</text>
<text x="112.4" y="231.9" transform="rotate(-0.27 110 232)" font-family="'Segoe Script','Bradley Hand','Ink Free','Comic Sans MS',cursive" font-size="20" fill="#1a2b8c">accurate. Prior P(D)=0.01, P(+|D)=0.9. So a positive</text>
<text x="111.7" y="270.0" transform="rotate(-0.24 110 272)" font-family="'Segoe Script','Bradley Hand','Ink Free','Comic Sans MS',cursive" font-size="20" fill="#1a2b8c">test raises belief in the disease.</text>
<text x="113.8" y="312.3" transform="rotate(-0.13 110 312)" font-family="'Segoe Script','Bradley Hand','Ink Free','Comic Sans MS',cursive" font-size="20" fill="#1a2b8c">2) Components of MDP: (i) set of States S (ii) set of</text>
<text x="112.5" y="352.1" transform="rotate(0.19 110 352)" font-family="'Segoe Script','Bradley Hand','Ink Free','Comic Sans MS',cursive" font-size="20" fill="#1a2b8c">Actions A (iii) Transition model P(s'|s,a) (iv) Reward</text>
<text x="113.6" y="390.2" transform="rotate(0.18 110 392)" font-family="'Segoe Script','Bradley Hand','Ink Free','Comic Sans MS',cursive" font-size="20" fill="#1a2b8c">function R(s,a,s') (v) Discount factor gamma.</text>
<text x="113.2" y="433.5" transform="rotate(0.28 110 432)" font-family="'Segoe Script','Bradley Hand','Ink Free','Comic Sans MS',cursive" font-size="20" fill="#1a2b8c">3) Numerical: P(D)=0.01, P(+|D)=0.9, P(+|not D)=0.05.</text>
<text x="110.4" y="471.6" transform="rotate(-0.11 110 472)" font-family="'Segoe Script','Bradley Hand','Ink Free','Comic Sans MS',cursive" font-size="20" fill="#1a2b8c">P(+)=0.9x0.01 + 0.05x0.99 = 0.009+0.0495 = 0.0585.</text>
<text x="110.3" y="510.2" transform="rotate(0.13 110 512)" font-family="'Segoe Script','Bradley Hand','Ink Free','Comic Sans MS',cursive" font-size="20" fill="#1a2b8c">P(D|+) = 0.009/0.0585 = 0.154 (about 15.4%).</text>
</svg>