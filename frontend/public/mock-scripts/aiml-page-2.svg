<text x="790" y="1185" font-family="Arial" font-size="13" fill="#888" text-anchor="end">Page 2</text>
<text x="22" y="112" font-family="Georgia, serif" font-size="21" font-weight="bold" fill="#1a2b8c">Q.2</text>
<text x="113.0" y="111.7" transform="rotate(-0.38 110 112)" font-family="'Segoe Script','Bradley Hand','Ink Free','Comic Sans MS',cursive" font-size="20" fill="#1a2b8c">1) Conditional probability is the probability of A given</text>
<text x="110.2" y="152.0" transform="rotate(-0.35 110 152)" font-family="'Segoe Script','Bradley Hand','Ink Free','Comic Sans MS',cursive" font-size="20" fill="#1a2b8c">B: P(A|B) = P(A and B)/P(B). Example: a bag has 3 red</text>
<text x="112.3" y="193.1" transform="rotate(0.17 110 192)" font-family="'Segoe Script','Bradley Hand','Ink Free','Comic Sans MS',cursive" font-size="20" fill="#1a2b8c">and 2 blue balls. If one red ball is drawn and not</text>
<text x="112.8" y="231.3" transform="rotate(0.38 110 232)" font-family="'Segoe Script','Bradley Hand','Ink Free','Comic Sans MS',cursive" font-size="20" fill="#1a2b8c">replaced, P(2nd is red | 1st red) = 2/4 = 1/2.</text>
<text x="111.8" y="272.3" transform="rotate(0.09 110 272)" font-family="'Segoe Script','Bradley Hand','Ink Free','Comic Sans MS',cursive" font-size="20" fill="#1a2b8c">2) Nodes in a Decision Network: (i) Chance nodes -</text>
<text x="111.9" y="313.8" transform="rotate(0.34 110 312)" font-family="'Segoe Script','Bradley Hand','Ink Free','Comic Sans MS',cursive" font-size="20" fill="#1a2b8c">random variables (ovals); (ii) Decision nodes - actions</text>
<text x="112.8" y="350.2" transform="rotate(0.16 110 352)" font-family="'Segoe Script','Bradley Hand','Ink Free','Comic Sans MS',cursive" font-size="20" fill="#1a2b8c">the agent can choose (rectangles); (iii) Utility nodes -</text>
<text x="113.3" y="394.0" transform="rotate(0.15 110 392)" font-family="'Segoe Script','Bradley Hand','Ink Free','Comic Sans MS',cursive" font-size="20" fill="#1a2b8c">the value of outcomes (diamonds).</text>
<text x="112.7" y="431.5" transform="rotate(-0.22 110 432)" font-family="'Segoe Script','Bradley Hand','Ink Free','Comic Sans MS',cursive" font-size="20" fill="#1a2b8c">3) Applications of Naive Bayes: (i) spam email filtering</text>
<text x="110.7" y="471.8" transform="rotate(-0.48 110 472)" font-family="'Segoe Script','Bradley Hand','Ink Free','Comic Sans MS',cursive" font-size="20" fill="#1a2b8c">(ii) text / sentiment classification.</text>
<text x="113.1" y="510.2" transform="rotate(-0.38 110 512)" font-family="'Segoe Script','Bradley Hand','Ink Free','Comic Sans MS',cursive" font-size="20" fill="#1a2b8c">4) Expected utility: for every action a the agent</text>
<text x="111.6" y="551.0" transform="rotate(-0.37 110 552)" font-family="'Segoe Script','Bradley Hand','Ink Free','Comic Sans MS',cursive" font-size="20" fill="#1a2b8c">computes EU(a) = sum of P(outcome | a) x U(outcome). It</text>
<text x="111.8" y="590.3" transform="rotate(0.37 110 592)" font-family="'Segoe Script','Bradley Hand','Ink Free','Comic Sans MS',cursive" font-size="20" fill="#1a2b8c">then chooses the action with maximum expected utility</text>
<text x="113.3" y="633.5" transform="rotate(0.05 110 632)" font-family="'Segoe Script','Bradley Hand','Ink Free','Comic Sans MS',cursive" font-size="20" fill="#1a2b8c">(MEU principle).</text>
</svg>