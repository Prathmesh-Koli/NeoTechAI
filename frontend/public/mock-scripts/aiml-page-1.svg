<text x="790" y="1185" font-family="Arial" font-size="13" fill="#888" text-anchor="end">Page 1</text>
<text x="110" y="112" font-family="'Segoe Script','Bradley Hand','Ink Free','Comic Sans MS',cursive" font-size="19" fill="#1a2b8c">Name: Sample Student        Seat No: 301245</text>
<text x="110" y="152" font-family="'Segoe Script','Bradley Hand','Ink Free','Comic Sans MS',cursive" font-size="19" fill="#1a2b8c">TYB.Sc (AI &amp; ML)   Sem V   AIML-301-MJ-T   AI - II</text>
<text x="22" y="192" font-family="Georgia, serif" font-size="21" font-weight="bold" fill="#1a2b8c">Q.1</text>
<text x="112.6" y="190.6" transform="rotate(-0.18 110 192)" font-family="'Segoe Script','Bradley Hand','Ink Free','Comic Sans MS',cursive" font-size="20" fill="#1a2b8c">a) Naive Bayes: a probabilistic classifier based on</text>
<text x="111.5" y="232.1" transform="rotate(-0.43 110 232)" font-family="'Segoe Script','Bradley Hand','Ink Free','Comic Sans MS',cursive" font-size="20" fill="#1a2b8c">Bayes' theorem that assumes features are conditionally</text>
<text x="110.1" y="272.0" transform="rotate(-0.44 110 272)" font-family="'Segoe Script','Bradley Hand','Ink Free','Comic Sans MS',cursive" font-size="20" fill="#1a2b8c">independent given the class.</text>
<text x="110.4" y="310.3" transform="rotate(-0.07 110 312)" font-family="'Segoe Script','Bradley Hand','Ink Free','Comic Sans MS',cursive" font-size="20" fill="#1a2b8c">b) HMM: Hidden Markov Model, a Markov process whose</text>
<text x="110.5" y="353.3" transform="rotate(-0.08 110 352)" font-family="'Segoe Script','Bradley Hand','Ink Free','Comic Sans MS',cursive" font-size="20" fill="#1a2b8c">states are hidden and seen only through observations.</text>
<text x="113.8" y="392.5" transform="rotate(-0.28 110 392)" font-family="'Segoe Script','Bradley Hand','Ink Free','Comic Sans MS',cursive" font-size="20" fill="#1a2b8c">c) Kalman Filter: a recursive algorithm that estimates</text>
<text x="113.9" y="431.6" transform="rotate(0.08 110 432)" font-family="'Segoe Script','Bradley Hand','Ink Free','Comic Sans MS',cursive" font-size="20" fill="#1a2b8c">the state of a linear system from noisy measurements.</text>
<text x="111.2" y="473.4" transform="rotate(-0.45 110 472)" font-family="'Segoe Script','Bradley Hand','Ink Free','Comic Sans MS',cursive" font-size="20" fill="#1a2b8c">d) MDP: Markov Decision Process - states, actions,</text>
<text x="111.2" y="510.5" transform="rotate(-0.36 110 512)" font-family="'Segoe Script','Bradley Hand','Ink Free','Comic Sans MS',cursive" font-size="20" fill="#1a2b8c">transition probabilities, rewards and a discount factor.</text>
<text x="112.3" y="550.7" transform="rotate(0.32 110 552)" font-family="'Segoe Script','Bradley Hand','Ink Free','Comic Sans MS',cursive" font-size="20" fill="#1a2b8c">e) Conditional probability: P(A|B) = P(A and B) / P(B),</text>
<text x="112.2" y="591.5" transform="rotate(0.14 110 592)" font-family="'Segoe Script','Bradley Hand','Ink Free','Comic Sans MS',cursive" font-size="20" fill="#1a2b8c">chance of A when B has occurred.</text>
<text x="110.8" y="630.2" transform="rotate(-0.44 110 632)" font-family="'Segoe Script','Bradley Hand','Ink Free','Comic Sans MS',cursive" font-size="20" fill="#1a2b8c">f) Utility function: gives a number to each state</text>
<text x="111.3" y="671.7" transform="rotate(0.18 110 672)" font-family="'Segoe Script','Bradley Hand','Ink Free','Comic Sans MS',cursive" font-size="20" fill="#1a2b8c">showing how desirable it is to the agent.</text>
<text x="111.2" y="711.8" transform="rotate(0.09 110 712)" font-family="'Segoe Script','Bradley Hand','Ink Free','Comic Sans MS',cursive" font-size="20" fill="#1a2b8c">g) DBN: a Bayesian network extended over time slices to</text>
<text x="111.0" y="752.8" transform="rotate(0.29 110 752)" font-family="'Segoe Script','Bradley Hand','Ink Free','Comic Sans MS',cursive" font-size="20" fill="#1a2b8c">model changing variables.</text>
<text x="113.5" y="792.1" transform="rotate(0.07 110 792)" font-family="'Segoe Script','Bradley Hand','Ink Free','Comic Sans MS',cursive" font-size="20" fill="#1a2b8c">h) Discount factor: gamma (0 to 1), decides how much</text>
<text x="113.9" y="831.2" transform="rotate(0.23 110 832)" font-family="'Segoe Script','Bradley Hand','Ink Free','Comic Sans MS',cursive" font-size="20" fill="#1a2b8c">future rewards are worth now.</text>
</svg>