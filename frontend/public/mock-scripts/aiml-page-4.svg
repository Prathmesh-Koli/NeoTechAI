<text x="790" y="1185" font-family="Arial" font-size="13" fill="#888" text-anchor="end">Page 4</text>
<text x="22" y="112" font-family="Georgia, serif" font-size="21" font-weight="bold" fill="#1a2b8c">Q.4</text>
<text x="111.4" y="110.6" transform="rotate(-0.29 110 112)" font-family="'Segoe Script','Bradley Hand','Ink Free','Comic Sans MS',cursive" font-size="20" fill="#1a2b8c">1) Value of Information: the expected gain in utility</text>
<text x="110.6" y="150.0" transform="rotate(-0.45 110 152)" font-family="'Segoe Script','Bradley Hand','Ink Free','Comic Sans MS',cursive" font-size="20" fill="#1a2b8c">from getting an extra piece of evidence before deciding.</text>
<text x="110.1" y="191.5" transform="rotate(-0.40 110 192)" font-family="'Segoe Script','Bradley Hand','Ink Free','Comic Sans MS',cursive" font-size="20" fill="#1a2b8c">VPI = EU(with info) - EU(without info). Example: a</text>
<text x="110.6" y="232.5" transform="rotate(0.37 110 232)" font-family="'Segoe Script','Bradley Hand','Ink Free','Comic Sans MS',cursive" font-size="20" fill="#1a2b8c">doctor ordering a test before choosing a treatment.</text>
<text x="111.5" y="271.4" transform="rotate(-0.25 110 272)" font-family="'Segoe Script','Bradley Hand','Ink Free','Comic Sans MS',cursive" font-size="20" fill="#1a2b8c">3) Discounted reward: rewards 5, 10, 20 with gamma =</text>
<text x="114.0" y="313.4" transform="rotate(-0.38 110 312)" font-family="'Segoe Script','Bradley Hand','Ink Free','Comic Sans MS',cursive" font-size="20" fill="#1a2b8c">0.9. Return = 5 + 0.9x10 + 0.81x20 = 5 + 9 + 16.2 =</text>
<text x="110.3" y="351.9" transform="rotate(-0.03 110 352)" font-family="'Segoe Script','Bradley Hand','Ink Free','Comic Sans MS',cursive" font-size="20" fill="#1a2b8c">30.2.</text>
<text x="22" y="392" font-family="Georgia, serif" font-size="21" font-weight="bold" fill="#1a2b8c">Q.5</text>
<text x="111.1" y="391.4" transform="rotate(-0.40 110 392)" font-family="'Segoe Script','Bradley Hand','Ink Free','Comic Sans MS',cursive" font-size="20" fill="#1a2b8c">2) HMM: transition P(H-&gt;H)=0.7, P(H-&gt;C)=0.3. Emission</text>
<text x="110.1" y="430.6" transform="rotate(0.33 110 432)" font-family="'Segoe Script','Bradley Hand','Ink Free','Comic Sans MS',cursive" font-size="20" fill="#1a2b8c">P(walk|H)=0.6. Start P(H)=0.5. P(H, walk) = 0.5 x 0.6 =</text>
<text x="110.6" y="472.1" transform="rotate(0.45 110 472)" font-family="'Segoe Script','Bradley Hand','Ink Free','Comic Sans MS',cursive" font-size="20" fill="#1a2b8c">0.30. Next step P(H)= 0.30 x 0.7 = 0.21 and multiply by</text>
<text x="112.1" y="510.1" transform="rotate(0.04 110 512)" font-family="'Segoe Script','Bradley Hand','Ink Free','Comic Sans MS',cursive" font-size="20" fill="#1a2b8c">emission probability of the next observation.</text>
